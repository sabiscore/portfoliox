name: CI
on:
  push:         { branches: [main] }
  pull_request: { branches: [main] }

jobs:
  quality:
    name: Lint · Type Check · Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.24.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm run type-check
      - run: pnpm run test:unit
      - run: pnpm build
      - uses: actions/upload-artifact@v4
        with:
          name: nextjs-build
          path: .next/
          retention-days: 1
          include-hidden-files: true

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.24.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - uses: actions/download-artifact@v4
        with: { name: nextjs-build, path: .next/ }
      # --workers=1: a single `next start` server backs every worker's requests.
      # Default parallelism (multiple workers hammering one shared server) causes
      # genuine resource contention that makes CommandPalette's lazy-loaded,
      # dynamically-imported chunk unreliable to hydrate in time — not a test
      # timing issue, a real concurrency bottleneck. test:smoke already forces
      # --workers=1 for the same reason and is reliably green.
      - run: pnpm exec playwright test --project=chromium --workers=1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  mobile:
    name: Mobile Regression
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.24.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium webkit
      - uses: actions/download-artifact@v4
        with: { name: nextjs-build, path: .next/ }
      # --workers=1: see the matching comment in the e2e job above.
      - run: pnpm exec playwright test --project=mobile-chrome --project=mobile-safari --workers=1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
