name: Conviction Agent

# Scheduled trigger disabled: conviction-fix.ts does unscoped blind regex
# rewrites (assumes an undefined `reveal` motion variant, deletes every
# style={{...}} including dynamic ones) across all tracked .tsx files.
# Re-enable the schedule only after the fixer is scoped to scanner-flagged
# files with transforms that don't corrupt animation/layout code.
on:
  workflow_dispatch:

jobs:
  heal:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.24.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install

      - name: Scan
        run: pnpm tsx scripts/conviction-scan.ts

      - name: Auto-fix
        run: |
          for file in $(git ls-files '*.tsx'); do
            pnpm tsx scripts/conviction-fix.ts $file
          done

      - name: Commit changes
        run: |
          git config user.name "conviction-agent"
          git config user.email "agent@bot.com"
          git checkout -b conviction/fixes
          git commit -am "chore: auto-fix conviction violations" || echo "No changes"
          # Branch is disposable bot output recreated fresh each run; force-push avoids
          # non-fast-forward rejection against a stale branch left by a prior run.
          git push origin conviction/fixes --force
